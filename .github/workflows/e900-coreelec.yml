name: E900 CoreELEC experimental build
run-name: E900 ${{ inputs.profile }} / ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Candidate patch profile (all builds remain unvalidated)
        type: choice
        default: decoder
        options: [baseline, identify, hdmi, decoder]
      target:
        description: Compile kernel, media modules, or USB test image (decoder profile)
        type: choice
        default: media
        options: [linux, media, image]
      source_trace:
        description: Enable source-level E900 early boot diagnostics (decoder only)
        type: boolean
        default: false

      vdin_capture:
        description: Build completed-frame VDIN diagnostics (decoder only, runtime opt-in)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e900-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PORT_ROOT: ${{ github.workspace }}/e900-port
      E900_PORT_ROOT: ${{ github.workspace }}/e900-port
      E900_WORK_ROOT: ${{ github.workspace }}/.e900-work
      E900_AUDIT_ROOT: ${{ github.workspace }}/.e900-work/downloads/.e900-fixtures
      E900_INCREMENTAL_REUSE: '1'
      E900_SOURCE_TRACE: ${{ inputs.source_trace && '1' || '0' }}
      E900_VDIN_CAPTURE: ${{ inputs.vdin_capture && '1' || '0' }}
      PROFILE: ${{ inputs.profile }}
      BUILD_TARGET: ${{ inputs.target }}
      CONCURRENCY_MAKE_LEVEL: '4'
      THREADCOUNT: '1'
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TERM: xterm
    steps:
      - name: Checkout fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Reclaim preinstalled runner tools and check disk
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          df -h
          # Only runs on the disposable GitHub runner, never the local Mac.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          free_gib=$(df --output=avail -BG "$RUNNER_TEMP" | tail -1 | tr -dc '0-9')
          required=35
          if [ "$BUILD_TARGET" = image ]; then required=50; fi
          df -h
          if [ "$free_gib" -lt "$required" ]; then
            echo "Need ${required}GiB free; runner has ${free_gib}GiB." >&2
            exit 1
          fi
          mkdir -p "$E900_WORK_ROOT/downloads"

      - name: Restore dependency deb packages
        id: debs
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.E900_WORK_ROOT }}/apt/*.deb
          key: e900-debs-v1-ubuntu22-${{ hashFiles('e900-port/scripts/ci-dependencies.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            e900-debs-v1-ubuntu22-${{ hashFiles('e900-port/scripts/ci-dependencies.sh') }}-
            e900-debs-v1-ubuntu22-

      - name: Install native build dependencies
        run: bash "$PORT_ROOT/scripts/ci-dependencies.sh"

      - name: Compute host and patch cache identities
        id: cache-keys
        run: python3 "$PORT_ROOT/scripts/build-cache.py" keys

      - name: Restore download cache
        id: downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.E900_WORK_ROOT }}/downloads
          key: e900-downloads-${{ hashFiles('e900-port/pins.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            e900-downloads-${{ hashFiles('e900-port/pins.json') }}-

      - name: Validate cached download integrity
        if: steps.downloads.outputs.cache-matched-key != ''
        shell: bash
        run: |
          set +e
          removed=0
          # Remove any file whose sha256 stamp doesn't match actual content (bit-rot or partial write).
          while IFS= read -r stamp_sha; do
            pkg="${stamp_sha%.sha256}"
            if [[ -f "$pkg" ]]; then
              expected=$(cat "$stamp_sha" 2>/dev/null)
              actual=$(sha256sum "$pkg" | cut -d' ' -f1)
              if [[ "$expected" != "$actual" ]]; then
                echo "Cache integrity: removing mismatched $(basename "$pkg")"
                rm -f "$pkg" "$stamp_sha" "${pkg}.url"
                removed=$((removed + 1))
              fi
            else
              rm -f "$stamp_sha" "${pkg}.url"
            fi
          done < <(find "$E900_WORK_ROOT/downloads" -maxdepth 3 -name "*.sha256" 2>/dev/null)
          # Remove archive files that have no stamp — these are failed downloads
          # (get_archive only writes the stamp on success; die() leaves the file).
          # Only match known source archive extensions to avoid touching metadata.
          while IFS= read -r pkg; do
            if [[ ! -f "${pkg}.sha256" ]]; then
              echo "Cache integrity: removing unstamped $(basename "$pkg")"
              rm -f "$pkg"
              removed=$((removed + 1))
            fi
          done < <(find "$E900_WORK_ROOT/downloads" -maxdepth 3 -type f \
                     \( -name "*.tar.gz" -o -name "*.tar.xz" -o -name "*.tar.bz2" \
                        -o -name "*.tar.zst" -o -name "*.tar.lz4" -o -name "*.zip" \
                        -o -name "*.7z" -o -name "*.tgz" \) 2>/dev/null)
          echo "Cache validation: removed $removed file(s)"

      - name: Restore compiler object cache
        id: compiler-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.E900_WORK_ROOT }}/ccache
          key: e900-ccache-v1-${{ steps.cache-keys.outputs.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            e900-ccache-v1-${{ steps.cache-keys.outputs.compiler }}-

      - name: Restore source checkout toolchain and incremental build state
        id: build-state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.E900_WORK_ROOT }}/CoreELEC-${{ inputs.profile }}
          key: e900-state-v1-${{ steps.cache-keys.outputs.compat }}-${{ steps.cache-keys.outputs.state }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            e900-state-v1-${{ steps.cache-keys.outputs.compat }}-${{ steps.cache-keys.outputs.state }}-
            e900-state-v1-${{ steps.cache-keys.outputs.compat }}-
            e900-state-v1-${{ steps.cache-keys.outputs.previous_compat }}-

      - name: Restore independent installed toolchain fallback
        id: toolchain-fallback
        if: steps.build-state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.E900_WORK_ROOT }}/toolchain-snapshot
          key: e900-toolchain-v1-${{ steps.cache-keys.outputs.compat }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            e900-toolchain-v1-${{ steps.cache-keys.outputs.compat }}-
            e900-toolchain-v1-${{ steps.cache-keys.outputs.previous_compat }}-

      - name: Apply compatible toolchain fallback
        if: steps.toolchain-fallback.outputs.cache-matched-key != ''
        run: python3 "$PORT_ROOT/scripts/toolchain-cache.py" restore "$E900_WORK_ROOT/CoreELEC-$PROFILE"

      - name: Prepare pinned upstream source and patches
        id: prepare
        run: bash "$PORT_ROOT/scripts/build.sh" prepare "$PROFILE"

      - name: Fetch verified public test fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$PORT_ROOT/scripts/fetch-test-fixtures.py"

      - name: Test patch application and host C logic
        run: |
          export E900_CE_REFERENCE="$E900_WORK_ROOT/CoreELEC-$PROFILE"
          python3 "$PORT_ROOT/tests/check-local.py"
          python3 "$PORT_ROOT/tests/check-di-clock.py"
          python3 "$PORT_ROOT/tests/check-media-buses.py"
          python3 "$PORT_ROOT/tests/check-post2.py"
          python3 "$PORT_ROOT/tests/check-video-pipeline.py"
          python3 "$PORT_ROOT/tests/check-video-init-order.py"
          python3 "$PORT_ROOT/tests/check-netconsole.py"
          python3 "$PORT_ROOT/tests/check-display-stage-hooks.py"
          python3 "$PORT_ROOT/tests/check-debug-foundation.py"
          python3 "$PORT_ROOT/tests/check-gen3-rmw-osd.py"
          python3 "$PORT_ROOT/tests/check-intermediate-pixels.py"
          python3 "$PORT_ROOT/tests/check-blend-boundary.py"
          python3 "$PORT_ROOT/tests/check-blend-transition.py"
          python3 "$PORT_ROOT/tests/check-transition-client.py"
          python3 "$PORT_ROOT/tests/check-register-transition-client.py"
          python3 "$PORT_ROOT/tests/check-loopback-pair.py"
          python3 "$PORT_ROOT/tests/check-runtime-sr.py"
          python3 "$PORT_ROOT/tests/check-video-rdma-watchdog.py"
          python3 "$PORT_ROOT/tests/check-hdr-evidence.py"
          python3 "$PORT_ROOT/tests/check-submit-tables.py"
          python3 "$PORT_ROOT/tests/check-submit-client.py"
          python3 "$PORT_ROOT/tests/check-hdr-recovery.py"
          python3 "$PORT_ROOT/tests/check-csc-signal-hold.py"
          python3 "$PORT_ROOT/tests/check-playback-timeline.py"
          python3 "$PORT_ROOT/tests/check-playback-audit.py"
          python3 "$PORT_ROOT/tests/check-playback-session.py"
          python3 "$PORT_ROOT/tests/check-vd1-call-boundaries.py"
          python3 "$PORT_ROOT/tests/check-downstream-returns.py"
          python3 "$PORT_ROOT/tests/check-pixel-preview.py"
          python3 "$PORT_ROOT/tests/check-toolchain-cache.py"
          python3 "$PORT_ROOT/tests/check-frame-capture.py"
          python3 "$PORT_ROOT/tests/check-vdin-capture.py"
          python3 "$PORT_ROOT/tests/check-media-install.py"
          python3 "$PORT_ROOT/tests/check-build-cache.py"
          python3 "$PORT_ROOT/tests/check-usb-image.py"

      - name: Check portable host optimization policy
        run: |
          E900_CE_REFERENCE="$E900_WORK_ROOT/CoreELEC-$PROFILE" python3 "$PORT_ROOT/tests/check-host-policy.py"
          cat "$E900_WORK_ROOT/cache-identity.json"

      - name: Compile selected target
        id: compile
        shell: bash
        run: |
          # Reserve time for logs and artifact upload within GitHub's six-hour job limit.
          timeout --signal=TERM --kill-after=60s 300m \
            bash "$PORT_ROOT/scripts/build.sh" "$BUILD_TARGET" "$PROFILE"

      - name: Diagnose failed host introspection scanner
        if: failure() && steps.compile.outcome == 'failure'
        timeout-minutes: 5
        continue-on-error: true
        run: python3 "$PORT_ROOT/scripts/diagnose-host-crash.py" "$E900_WORK_ROOT/CoreELEC-$PROFILE"

      - name: Validate compiled E900 board DTB
        if: inputs.profile == 'decoder'
        run: python3 "$PORT_ROOT/scripts/validate-board.py" "$E900_WORK_ROOT/CoreELEC-$PROFILE"

      - name: Prepare and read back E900 USB test image
        if: inputs.profile == 'decoder' && inputs.target == 'image'
        run: |
          repo="$E900_WORK_ROOT/CoreELEC-$PROFILE"
          dtbs=("$repo"/build.*/build/linux-*/arch/arm64/boot/dts/amlogic/coreelec-gxl/gxlx2_p291_1g_e900v21c.dtb)
          toolbins=("$repo"/build.*/toolchain/bin)
          test "${#dtbs[@]}" = 1
          test "${#toolbins[@]}" = 1
          python3 "$PORT_ROOT/tests/check-usb-roundtrip.py" "${dtbs[0]}" "${toolbins[0]}" "${toolbins[0]}/mkimage"
          python3 "$PORT_ROOT/scripts/prepare-usb-image.py" "$E900_WORK_ROOT/CoreELEC-$PROFILE"
          python3 "$PORT_ROOT/scripts/export-artifacts.py" "$E900_WORK_ROOT/CoreELEC-$PROFILE" "$PROFILE" image 0

      - name: Prepare bounded cache snapshots
        id: cache-snapshots
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        run: python3 "$PORT_ROOT/scripts/toolchain-cache.py" prepare "$E900_WORK_ROOT/CoreELEC-$PROFILE"

      - name: Save toolchain and incremental build state even after compile failure
        if: always() && !cancelled() && steps.cache-snapshots.outputs.full_ready == 'true'
        timeout-minutes: 20
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.E900_WORK_ROOT }}/CoreELEC-${{ inputs.profile }}
          key: ${{ steps.build-state.outputs.cache-primary-key }}

      - name: Save compiler object cache
        if: always() && !cancelled() && steps.compiler-cache.outputs.cache-primary-key != ''
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.E900_WORK_ROOT }}/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Save source download cache
        if: steps.compile.outcome == 'success' && steps.downloads.outputs.cache-primary-key != ''
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.E900_WORK_ROOT }}/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}

      - name: Save dependency deb packages
        if: always() && !cancelled() && steps.debs.outputs.cache-primary-key != ''
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.E900_WORK_ROOT }}/apt/*.deb
          key: ${{ steps.debs.outputs.cache-primary-key }}

      - name: Save independent installed toolchain fallback
        if: always() && !cancelled() && steps.cache-snapshots.outputs.toolchain_ready == 'true'
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.E900_WORK_ROOT }}/toolchain-snapshot
          key: e900-toolchain-v1-${{ steps.cache-keys.outputs.compat }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload experimental binaries and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e900-${{ inputs.profile }}-${{ inputs.target }}-${{ github.run_id }}
          path: |
            ${{ env.E900_WORK_ROOT }}/export/
            ${{ env.E900_WORK_ROOT }}/logs/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true

      - name: Summarize validation status
        if: always()
        shell: bash
        run: |
          {
            echo '### Experimental CoreELEC build'
            echo "Profile: $PROFILE; target: $BUILD_TARGET"
            echo 'Compilation is separate from hardware validation.'
            echo 'Decoder profile integrates an experimental E900V21C DTB; hardware tests remain pending.'
            echo 'Only a prepared *-E900V21C-USB-TEST.img.gz is intended for external USB testing.'
            echo 'Check build-metadata.json: usb_image_prepared must be true; never install these artifacts to eMMC.'
            echo "Build checkpoint: ${{ steps.build-state.outputs.cache-matched-key }}"
            echo "Compiler cache: ${{ steps.compiler-cache.outputs.cache-matched-key }}"
            echo 'Matching checkpoints retain the toolchain, completed package stamps and partial build directories.'
            df -h "$RUNNER_TEMP"
          } >> "$GITHUB_STEP_SUMMARY"
